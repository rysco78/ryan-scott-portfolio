<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>AI Agents KB – Download</title>
<style>
  :root { --bg:#0f172a; --fg:#e2e8f0; --muted:#94a3b8; --card:#1e293b; --border:#334155; --accent:#f59e0b; --err:#f87171; }
  @media (prefers-color-scheme: light) { :root { --bg:#f8fafc; --fg:#0f172a; --muted:#475569; --card:#fff; --border:#cbd5e1; --accent:#b45309; --err:#b91c1c; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif; }
  main { width:100%; max-width:420px; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:24px; }
  h1 { font-size:1.25rem; margin:0 0 4px; }
  p { color:var(--muted); margin:0 0 16px; font-size:.9rem; }
  label { display:block; font-size:.85rem; margin-bottom:6px; }
  input, button { width:100%; font:inherit; padding:10px 12px; border-radius:8px; border:1px solid var(--border); }
  input { background:var(--bg); color:var(--fg); }
  button { margin-top:12px; background:var(--accent); color:#111; border-color:var(--accent); font-weight:600; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  input:focus-visible, button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  #msg { min-height:1.4em; margin-top:12px; font-size:.9rem; color:var(--muted); }
  #msg.err { color:var(--err); }
</style>
</head>
<body>
<main>
  <h1>AI Agents KB</h1>
  <p>Enter the password to download <code>AI-Agents-KB.zip</code>.</p>
  <form id="f">
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="off" required autofocus>
    <button id="go" type="submit">Download</button>
  </form>
  <div id="msg" role="status" aria-live="polite"></div>
</main>
<script>
const f = document.getElementById('f'), pw = document.getElementById('pw'), go = document.getElementById('go'), msg = document.getElementById('msg');
function say(t, err) { msg.textContent = t; msg.className = err ? 'err' : ''; }
f.addEventListener('submit', async (e) => {
  e.preventDefault();
  go.disabled = true; say('Decrypting…');
  try {
    const buf = new Uint8Array(await (await fetch('ai-agents-kb.enc')).arrayBuffer());
    const salt = buf.slice(0, 16), iv = buf.slice(16, 28), ct = buf.slice(28);
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw.value.trim()), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 600000, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([plain], { type: 'application/zip' }));
    a.download = 'AI-Agents-KB.zip';
    document.body.appendChild(a); a.click(); a.remove();
    say('Downloaded.');
  } catch (err) {
    say(err && err.name === 'OperationError' ? 'Incorrect password.' : 'Something went wrong. Try again.', true);
  } finally { go.disabled = false; }
});
</script>
</body>
</html>
